<!doctype html>
<html>
  <head><title>YouTube fixture</title></head>
  <body>
    <ytd-mini-guide-renderer>
      <ytd-mini-guide-entry-renderer aria-label="Home" data-keep><a href="/">Home</a></ytd-mini-guide-entry-renderer>
      <ytd-mini-guide-entry-renderer aria-label="Shorts" data-hidden-by="hideShorts"><a>Shorts</a></ytd-mini-guide-entry-renderer>
      <ytd-mini-guide-entry-renderer data-hidden-by="hidePlayables"><a href="/playables">Playables</a></ytd-mini-guide-entry-renderer>
    </ytd-mini-guide-renderer>

    <ytd-guide-renderer>
      <ytd-guide-section-renderer data-keep>
        <ytd-guide-entry-renderer data-keep><a href="/" title="Home">Home</a></ytd-guide-entry-renderer>
        <ytd-guide-entry-renderer data-hidden-by="hideShorts"><a title="Shorts">Shorts</a></ytd-guide-entry-renderer>
        <ytd-guide-entry-renderer data-keep><a href="/feed/subscriptions" title="Subscriptions">Subscriptions</a></ytd-guide-entry-renderer>
      </ytd-guide-section-renderer>
      <ytd-guide-section-renderer data-hidden-by="hideSubscriptions">
        <a href="/feed/subscriptions">Subscriptions</a>
        <ytd-guide-entry-renderer><a href="/@example">Example channel</a></ytd-guide-entry-renderer>
      </ytd-guide-section-renderer>
      <ytd-guide-section-renderer data-keep>
        <a href="/feed/you">You</a>
        <a href="/feed/subscriptions">Subscriptions</a>
      </ytd-guide-section-renderer>
      <ytd-guide-section-renderer data-keep>
        <ytd-guide-entry-renderer data-hidden-by="hidePlayables"><a href="/playables">Playables</a></ytd-guide-entry-renderer>
        <ytd-guide-entry-renderer data-keep><a href="/feed/trending">Trending</a></ytd-guide-entry-renderer>
      </ytd-guide-section-renderer>
    </ytd-guide-renderer>

    <ytd-browse page-subtype="home">
      <ytd-rich-grid-renderer data-hidden-by="hideHomeFeed">
        <ytd-rich-item-renderer data-hidden-by="hideHomeFeed"><a href="/watch?v=one">Example video</a></ytd-rich-item-renderer>
        <ytd-rich-section-renderer data-hidden-by="hideShorts hideHomeFeed">
          <div is-shorts>Shorts shelf</div>
        </ytd-rich-section-renderer>
        <ytd-rich-shelf-renderer is-shorts data-hidden-by="hideShorts hideHomeFeed">Shorts shelf</ytd-rich-shelf-renderer>
        <ytd-rich-section-renderer data-hidden-by="hidePlayables hideHomeFeed">
          <a href="/playables/example">Example game</a>
        </ytd-rich-section-renderer>
        <ytd-rich-section-renderer data-hidden-by="hideHomeFeed">
          <a href="/watch?v=two">Breaking news shelf</a>
        </ytd-rich-section-renderer>
      </ytd-rich-grid-renderer>
    </ytd-browse>

    <ytd-browse page-subtype="subscriptions">
      <ytd-rich-grid-renderer data-keep>
        <ytd-reel-shelf-renderer data-hidden-by="hideShorts">Shorts shelf</ytd-reel-shelf-renderer>
        <grid-shelf-view-model data-hidden-by="hideShorts"><a href="/shorts/example">Example short</a></grid-shelf-view-model>
        <grid-shelf-view-model data-keep><a href="/watch?v=three">Example shelf</a></grid-shelf-view-model>
      </ytd-rich-grid-renderer>
    </ytd-browse>
  </body>
</html>
