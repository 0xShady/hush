<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hush icon: feed rows, top rows dissolving (hidden), one row highlighted. -->
  <defs>
    <clipPath id="round"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="128" height="128" fill="#F3F4F6"/>

    <!-- Sidebar -->
    <rect x="14" y="22" width="20" height="84" rx="7" fill="#8A93A1"/>

    <!-- Kept rows (clean, light) -->
    <g>
      <rect x="44" y="54" width="70" height="11" rx="4" fill="#FFFFFF" stroke="#E2E4E9" stroke-width="1"/>
      <rect x="44" y="69" width="70" height="11" rx="4" fill="#FFFFFF" stroke="#E2E4E9" stroke-width="1"/>
      <rect x="44" y="99" width="70" height="11" rx="4" fill="#FFFFFF" stroke="#E2E4E9" stroke-width="1"/>
    </g>

    <!-- Highlighted row -->
    <rect x="44" y="84" width="70" height="11" rx="4" fill="#2563EB"/>

    <!-- Dissolving rows (top two) -->
    <g fill="#8A93A1">
      <rect x="44" y="24" width="40" height="11" rx="4"/>
      <rect x="44" y="39" width="40" height="11" rx="4"/>
    </g>

    <!-- Dissolve particles drifting up-right, fading out -->
    <g fill="#8A93A1">
      <rect x="86" y="26" width="7" height="7" rx="2" opacity="0.95"/>
      <rect x="95" y="22" width="6" height="6" rx="2" opacity="0.8"/>
      <rect x="92" y="32" width="5" height="5" rx="1.5" opacity="0.7"/>
      <rect x="103" y="25" width="5" height="5" rx="1.5" opacity="0.55"/>
      <rect x="101" y="34" width="4" height="4" rx="1.5" opacity="0.45"/>
      <rect x="111" y="22" width="4" height="4" rx="1.5" opacity="0.35"/>

      <rect x="86" y="41" width="7" height="7" rx="2" opacity="0.95"/>
      <rect x="95" y="44" width="6" height="6" rx="2" opacity="0.75"/>
      <rect x="94" y="37" width="4" height="4" rx="1.5" opacity="0.6"/>
      <rect x="104" y="40" width="5" height="5" rx="1.5" opacity="0.5"/>
      <rect x="102" y="47" width="4" height="4" rx="1.5" opacity="0.35"/>
      <rect x="112" y="38" width="4" height="4" rx="1.5" opacity="0.3"/>
    </g>
  </g>
</svg>
